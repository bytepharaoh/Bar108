name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bar108_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: test
      APP_PORT: 8080
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: bar108_test
      DB_SSLMODE: disable
      JWT_SECRET: daef0e7d5c1e54a8601faf5c209bfe0b63f84014aa57fae5b993faf4ccbc5eb8
      JWT_EXPIRY_HOURS: 24

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1" 
          cache: true # update to match your go.mod

      - name: Install dependencies
        run: go mod download

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Run tests with race detector
        run: go test -race -timeout 60s -count=1 ./...
        # -count=1 disables test caching — always runs fresh

      - name: Build binary
        run: go build -o bin/bar108 ./cmd/main.go

      - name: Build Docker image
        run: docker build -t bar108:${{ github.sha }} .