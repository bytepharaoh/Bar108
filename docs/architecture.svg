<svg width="780" height="420" viewBox="0 0 780 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="780" height="420" fill="#0D0D0D" rx="16"/>

  <!-- Title -->
  <text x="390" y="36" text-anchor="middle" font-family="monospace" font-size="13" fill="#666" letter-spacing="4">SYSTEM ARCHITECTURE</text>

  <!-- CLIENT -->
  <rect x="240" y="55" width="300" height="52" rx="8" fill="#1A1A1A" stroke="#FF4D00" stroke-width="1.5"/>
  <text x="390" y="76" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FF4D00">CLIENT</text>
  <text x="390" y="96" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">Web App · Mobile App</text>

  <!-- Arrow down -->
  <line x1="390" y1="107" x2="390" y2="128" stroke="#FF4D00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="390,136 384,124 396,124" fill="#FF4D00"/>
  <text x="410" y="122" font-family="monospace" font-size="10" fill="#444">HTTP/JSON</text>

  <!-- GIN ROUTER -->
  <rect x="140" y="136" width="500" height="52" rx="8" fill="#1A1A1A" stroke="#FF8C00" stroke-width="1.5"/>
  <text x="390" y="157" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#FF8C00">GIN ROUTER</text>
  <text x="390" y="177" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">Middleware · Auth · Rate Limiting · CORS</text>

  <!-- Arrow down -->
  <line x1="390" y1="188" x2="390" y2="208" stroke="#FF8C00" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="390,216 384,204 396,204" fill="#FF8C00"/>

  <!-- HANDLERS ROW -->
  <rect x="60" y="216" width="190" height="52" rx="8" fill="#1A1A1A" stroke="#FFB800" stroke-width="1.5"/>
  <text x="155" y="237" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#FFB800">/menu</text>
  <text x="155" y="257" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">Handlers</text>

  <rect x="295" y="216" width="190" height="52" rx="8" fill="#1A1A1A" stroke="#FFB800" stroke-width="1.5"/>
  <text x="390" y="237" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#FFB800">/orders</text>
  <text x="390" y="257" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">Handlers</text>

  <rect x="530" y="216" width="190" height="52" rx="8" fill="#1A1A1A" stroke="#FFB800" stroke-width="1.5"/>
  <text x="625" y="237" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#FFB800">/users</text>
  <text x="625" y="257" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">Handlers</text>

  <!-- Arrow down -->
  <line x1="390" y1="268" x2="390" y2="288" stroke="#FFB800" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="390,296 384,284 396,284" fill="#FFB800"/>

  <!-- SERVICE LAYER -->
  <rect x="140" y="296" width="500" height="52" rx="8" fill="#1A1A1A" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="390" y="317" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#00D4AA">SERVICE LAYER</text>
  <text x="390" y="337" text-anchor="middle" font-family="monospace" font-size="11" fill="#555">Business Logic · Validation · Rules · Error Translation</text>

  <!-- Arrow down -->
  <line x1="390" y1="348" x2="390" y2="368" stroke="#00D4AA" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="390,376 384,364 396,364" fill="#00D4AA"/>

  <!-- REPOSITORY + DB side by side -->
  <rect x="60" y="376" width="350" height="32" rx="8" fill="#1A1A1A" stroke="#4D9EFF" stroke-width="1.5"/>
  <text x="235" y="397" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#4D9EFF">REPOSITORY  ·  SQLC Generated Queries</text>

  <rect x="430" y="376" width="290" height="32" rx="8" fill="#1A1A1A" stroke="#4169E1" stroke-width="1.5"/>
  <text x="575" y="392" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#4169E1">PostgreSQL 16</text>
  <text x="575" y="405" text-anchor="middle" font-family="monospace" font-size="10" fill="#444">9 Tables · Constraints</text>

  <!-- Arrow between repo and db -->
  <line x1="410" y1="392" x2="430" y2="392" stroke="#4D9EFF" stroke-width="1.5"/>
  <polygon points="430,392 420,387 420,397" fill="#4D9EFF"/>
</svg>
