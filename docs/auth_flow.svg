<svg width="780" height="200" viewBox="0 0 780 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="780" height="200" fill="#0D0D0D" rx="12"/>
  <text x="390" y="26" text-anchor="middle" font-family="monospace" font-size="10" fill="#444" letter-spacing="4">JWT AUTHENTICATION FLOW</text>

  <!-- REGISTER / LOGIN -->
  <rect x="20" y="48" width="160" height="80" rx="8" fill="#1A1A1A" stroke="#FF4D00" stroke-width="1.5"/>
  <text x="100" y="70" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#FF4D00">Client</text>
  <text x="100" y="90" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">POST /auth/register</text>
  <text x="100" y="106" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">POST /auth/login</text>
  <text x="100" y="122" text-anchor="middle" font-family="monospace" font-size="9" fill="#444">{ email, password }</text>

  <!-- Arrow to server -->
  <line x1="180" y1="88" x2="230" y2="88" stroke="#FF4D00" stroke-width="1.5"/>
  <polygon points="230,88 220,83 220,93" fill="#FF4D00"/>

  <!-- SERVER -->
  <rect x="230" y="48" width="200" height="80" rx="8" fill="#1A1A1A" stroke="#FF8C00" stroke-width="1.5"/>
  <text x="330" y="70" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#FF8C00">Server</text>
  <text x="330" y="88" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">verify credentials</text>
  <text x="330" y="104" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">bcrypt compare</text>
  <text x="330" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">generate JWT token</text>

  <!-- Arrow back -->
  <line x1="430" y1="88" x2="480" y2="88" stroke="#00D4AA" stroke-width="1.5"/>
  <polygon points="480,88 470,83 470,93" fill="#00D4AA"/>
  <text x="455" y="80" text-anchor="middle" font-family="monospace" font-size="8" fill="#00D4AA">token</text>

  <!-- TOKEN -->
  <rect x="480" y="48" width="280" height="80" rx="8" fill="#1A1A1A" stroke="#00D4AA" stroke-width="1.5"/>
  <text x="620" y="70" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#00D4AA">JWT Token</text>
  <text x="620" y="88" text-anchor="middle" font-family="monospace" font-size="9" fill="#666">header.payload.signature</text>
  <text x="620" y="104" text-anchor="middle" font-family="monospace" font-size="9" fill="#4D9EFF">{ user_id: 1, role: "admin" }</text>
  <text x="620" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">expires in 24h · HS256 signed</text>

  <!-- Protected request flow -->
  <text x="390" y="158" text-anchor="middle" font-family="monospace" font-size="9" fill="#555">— subsequent requests —</text>

  <rect x="20" y="168" width="120" height="24" rx="5" fill="#1A1A1A" stroke="#FF4D00" stroke-width="1"/>
  <text x="80" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#FF4D00">Authorization:</text>

  <line x1="140" y1="180" x2="180" y2="180" stroke="#444" stroke-width="1"/>

  <rect x="180" y="168" width="160" height="24" rx="5" fill="#1A1A1A" stroke="#FF8C00" stroke-width="1"/>
  <text x="260" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#FF8C00">middleware verifies</text>

  <line x1="340" y1="180" x2="380" y2="180" stroke="#444" stroke-width="1"/>

  <rect x="380" y="168" width="140" height="24" rx="5" fill="#1A1A1A" stroke="#FFB800" stroke-width="1"/>
  <text x="450" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#FFB800">injects user_id + role</text>

  <line x1="520" y1="180" x2="560" y2="180" stroke="#444" stroke-width="1"/>

  <rect x="560" y="168" width="120" height="24" rx="5" fill="#1A1A1A" stroke="#00D4AA" stroke-width="1"/>
  <text x="620" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#00D4AA">handler proceeds</text>
</svg>
